risks:
- No open real Indian clinical reports exist; results on synthetic reports may overstate real performance (state
  this; seek an IRB-approved real-report check later)
- Removing explicit identifiers does not remove re-identification risk from rare diagnoses, small towns or dates
  (quasi-identifiers)
- Meddies-PII (17 languages) and MedDeID may release multilingual clinical models during the study
- DATE redaction destroys intervals that clinical questions need; date-shifting must be designed carefully
- The models' own benchmark (IndicPIIDetX) comes from the same group
access_actions:
- None for the models or the three Indian benchmarks (open, not gated)
- 'Optional English clinical check: PhysioNet credentialing + CITI training (~1–2 weeks) for the deidentified nursing-notes
  corpus'
- API key for one cloud LLM (Claude or GPT) for the utility arm, used only on synthetic reports
