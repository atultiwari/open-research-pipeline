id: indic-clinical-pii-redaction
title: Can a 17–58M-parameter model on a clinic laptop strip patient identifiers from Indian lab, pathology and
  discharge reports well enough to send them to a cloud LLM? Leakage, over-redaction and downstream-utility benchmark
  on a synthetic Indian report corpus
area: clinical-data-llm
source:
  type: model
  title: 'cbx-indic-pii-extractor (17M, 36M, 58M): Indian PII extraction models (Hugging Face collection ''Indic
    PII Extractor'')'
  authors: CobuildX-AI
  venue: Hugging Face model release
  date: '2026-11-05'
  url: https://huggingface.co/collections/CobuildX-AI/indic-pii-extractor
  code_url: https://huggingface.co/CobuildX-AI/cbx-indic-pii-extractor-17M
  code_licence: Apache-2.0 (models and bundled pii.py); base model mmBERT-small is MIT
  code_note: No paper. Model cards report results on IndicPIIDetX (same group), Ylemis India-PII and IndiaPII-Bench.
    Trained on ~74,000 synthetic documents; the 307M teacher is not released.
study_type: Benchmark of small on-device de-identification models on a new synthetic Indian clinical-report corpus,
  with a downstream cloud-LLM utility test
reporting_guideline: TRIPOD+AI (adapted for NLP de-identification); TRIPOD-LLM items for the cloud-LLM utility arm
novelty_delta: The Indic PII models were trained and tested on chats, emails and forms, and do not cover structured
  Indian lab, pathology and discharge reports (UHID and lab IDs, referring doctors, sample barcodes, eponymous diseases).
  This study builds a pathologist-designed synthetic corpus of such reports, measures identifier leakage on a CPU
  laptop, measures over-redaction of clinically needed content (dates, eponyms, doses), and checks that cloud-LLM
  answers on redacted reports match answers on the originals.
compute:
  tier: laptop
  estimate: Inference and evaluation on a CPU laptop; optional fine-tuning of the 17M/58M models on Colab or RunPod
    (1–3 GPU-h); cloud-LLM utility arm ~US$10–40 in API calls; corpus generation with a local or API LLM ~US$5–20
est_weeks: 6
scores:
