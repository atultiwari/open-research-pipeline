risks:
- Jordán's preregistered leave-one-dataset-out benchmark (OSF doi:10.17605/osf.io/kga5m, frozen encoders, APCData
  and RIVA as external cohorts, deferral) may report first; keep the liquid-based arm, the cytology encoders and
  the annotator analysis central
- 'Novelty search was partial: OpenAlex hit its daily limit mid-search, and arXiv and Semantic Scholar returned
  HTTP 429; rerun before drafting, including citations of CROWN and CervixFM'
- Pretraining sources of CROWN (10M cytology patches) and CervixFM are not fully public; they may overlap the public
  test sets
- HiCervix needs manual Zenodo approval with an institutional email; its preparation method (liquid-based or not)
  and slide identifiers are still to be confirmed
- MLCC has no patient key (963 images from 460 patients), 972 files against 963 described, and an independent reclassification
  disputes some labels
- CRIC has no slide identifier, so fields from one slide may cross splits; APCData appears to hold duplicate images
- Label harmonisation is lossy (SIPaKMeD morphological classes, APACC binary only, RIVA INF/ENDO, HiCervix glandular
  and organism classes) and needs explicit sensitivity analyses
- UNI2-h, Virchow2, CONCH v1.5, H-optimus-1 and H0-mini are CC-BY-NC-ND and gated; CytoFM and the CROWN and HiCervix
  code repositories have no licence; SIPaKMeD states no licence
- Two JASC 2026 meeting abstracts on foundation-model errors in cervical cytology could not be read and may overlap
  Gap 4
