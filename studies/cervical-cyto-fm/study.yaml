novelty_delta: The source tested five general or histology encoders within each dataset only, on random splits.
  This study maps seven open cervical datasets to one pathologist-signed Bethesda scheme and tests transfer in both
  directions between conventional Pap and liquid-based cytology. It gives the first independent cross-dataset comparison
  of the new cytology encoders (CROWN, CervixFM, CytoFM) with UNI2-h, Virchow2, H-optimus and CONCH v1.5. It also
  measures how many local cells few-shot LoRA needs to adapt to a new site, and whether model errors fall where
  RIVA's four cytologists disagree. The closest planned work (Jordán, OSF 2026) covers conventional-smear cohorts
  with frozen features and deferral only.
