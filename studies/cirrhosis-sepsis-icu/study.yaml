  estimate: Laptop CPU, 16 GB RAM, ~100 GB disk for local PostgreSQL/DuckDB builds of MIMIC-IV and eICU (verify).
    SQL builds take hours; modelling minutes. No GPU, no API (DUA forbids external LLM APIs).
