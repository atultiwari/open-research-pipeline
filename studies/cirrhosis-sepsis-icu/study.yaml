study_type: Prognostic model replication + head-to-head external validation of multiple published models and liver/ICU
  scores (temporal and multi-hospital), with a reduced-variable model
reporting_guideline: TRIPOD+AI; RECORD
novelty_delta: At least seven MIMIC-IV cirrhosis–sepsis mortality models (2024–2026) were each tested only by their
  own authors; none has been compared head-to-head in one external cohort. This study reimplements them with locked
  coefficients on MIMIC-IV 2017–2022 and eICU, adds MELD 3.0, CLIF-C AD (non-ACLF only) and APACHE IVa, which have
  not been evaluated in cirrhosis with sepsis, reports calibration, recalibration and between-hospital heterogeneity
  across eICU, and tests a lactate-free bedside variant.
