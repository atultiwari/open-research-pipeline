risks:
- 'Very crowded field: new MIMIC-IV cirrhosis papers appear almost weekly; rerun OpenAlex novelty checks (rate-limited
  on 2026-11-06) before the protocol'
- Some competing models may not publish an intercept or full equation; those can be validated for discrimination
  only
- 'eICU phenotyping is ambiguous: no billing discharge diagnoses and no ready-made Sepsis-3 concept; results depend
  on the cirrhosis and sepsis definitions (pre-specify, run sensitivity analyses)'
- Hepatic encephalopathy grade has no direct field in either database; CLIF-OF/ACLF/Child-Pugh need a GCS-based
  proxy
- Many eICU hospitals will have <10 events; site-level heterogeneity must be pooled by region/bed-size strata
- 'Indian relevance of the lactate-free variant is a framing only: no open Indian ICU data exist for validation'
- 'PhysioNet DUA: no row-level data to Claude or any external LLM API; analysis must run locally with aggregates
  only shared back'
- Source's cirrhosis ICD list (Supplementary Table 1) not yet read; MIMIC calendar split via anchor_year_group is
  approximate
access_actions:
- PhysioNet credentialing + CITI 'Data or Specimens Only Research' training + sign the Credentialed Health Data
  Use Agreement 1.5.0 on both the MIMIC-IV v3.1 and eICU-CRD v2.0 pages (~1–2 weeks; start early)
- Read the source's Supplementary Table 1 (cirrhosis ICD codes) from the Frontiers/PMC article page
- Check whether Lin 2024, Hu 2026 and Xu X 2026 print full model equations; email authors for intercepts if not
