study_type: 'Diagnostic accuracy under an imperfect reference standard: multiverse sensitivity analysis + measurement-uncertainty
  simulation + temporal validation of locked scores (survey-weighted, cross-sectional)'
reporting_guideline: STARD 2015 + RECORD; TRIPOD+AI for the locked-score validation arm
novelty_delta: 'Temporal validation on 2021–23 and race/lean stratification have already been published (Jiang et
  al., Gut and Liver 2026; Lasington et al., IDDF 2026). This study instead asks whether FIB-4 ''false negatives''
  are real: it re-estimates them across defensible reference-standard and cohort choices (LSM reliability, probe,
  CAP-aware thresholds, serology-based viral and correctly coded alcohol exclusions), quantifies the FIB-4 measurement
  grey zone from AST/ALT/platelet biological and analytical variation, and only then compares locked SAFE, MAF-5,
  LiverRisk, NFS and FIB-4 Plus in the 2021–23 FIB-4 < 1.3 stratum with design-based statistics.'
