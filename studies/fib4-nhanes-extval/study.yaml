  fit: 4
risks:
- 'Crowded field: Jiang et al. 2026 (Gut and Liver) already did 2017–20 development with 2021–23 temporal validation
  of a second-stage model; novelty rests on the reference-standard and measurement-error angle'
- LSM is not histology; CAP-aware LSM thresholds and biological-variation CVs must come from cited published sources
  (verify before use), or the multiverse looks arbitrary
- Asian and lean subgroups are small (DEMO_L has 681 non-Hispanic Asian participants; source found 3 lean false
  negatives); report wide CIs and NCHS reliability flags
- 'Weighting errors: 2021–23 needs WTPH2YR (phlebotomy) with SDMVSTRA/SDMVPSU; 2017–20 P_ weights are valid only
  for the combined pre-pandemic file; pooling cycles needs NCHS guidance'
- Variable renames between cycles (LBXTR→LBXTLG, BPQ040A→BPQ150, HEQ030 dropped) silently create missing values
  if not harmonised
- Source repo download URLs return an HTML page with HTTP 200; unpatched runs write HTML files named .XPT
- Source is a conference abstract with no peer-reviewed paper; its numbers come only from repo result files
access_actions:
- 'None needed: NHANES public-use files download without an account (NCHS data use agreement: statistical analysis
  only, no re-identification or linkage)'
- 'Optional: ask Jiang et al. for their locked coefficients and calculator files (available on request per the paper)
  to add their pathway as a comparator'
