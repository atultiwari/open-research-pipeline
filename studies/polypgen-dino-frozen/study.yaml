reporting_guideline: CLAIM 2024
novelty_delta: The authors have since fixed the freezing bug themselves (frozen DINO loses 7-10 Dice points; only
  fine-tuned DINOv3 beats UM-Net), but every result is still PolypGen-only and polyp-positive-only. This study adds
  the first zero-shot tests of PolypGen-trained frozen and fine-tuned DINOv2/v3 segmenters on LMIC centres (PolypDB-Vietnam,
  FAR-POLYP-SEG Iran), false-positive rates on 7,749 normal-mucosa frames, calibration, and subgroups by size, modality
  and bowel preparation.
