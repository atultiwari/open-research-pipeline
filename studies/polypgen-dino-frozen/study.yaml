risks:
- 'Crowded field: PolypDINO, Polyp-DiFoM, SegDINO and others already test DINO-based polyp segmenters on Kvasir/CVC;
  novelty rests on the Iran/Vietnam sets and normal-frame false positives'
- The authors' corrected MLMI 2026 paper may appear with extra analyses; recheck before the protocol
- 'Licence mix: Kvasir-SEG and CVC-ClinicDB are research/education only (NC-like); PolypGen forbids redistribution
  despite CC BY 4.0 in its paper; PolypDB has no formal licence'
- CVC-ClinicDB official download link is empty; only unofficial mirrors were found
- Dataset overlap (Kvasir-SEG within HyperKvasir; PolypDB Norway from HyperKvasir) needs a hash check
- No histology in any dataset, so the pathologist contribution is limited to visual error review
- Original code does not run as published; reimplementation needed
access_actions:
- Free Synapse account for PolypGen; cite all three required papers
- Hugging Face gated access (manual approval) for DINOv3 weights; DINOv2 is open (Apache-2.0)
- Download FAR-POLYP-SEG (Zenodo, 344 MB) and PolypDB (OSF, 1.39 GB); no registration
- Kvasir-SEG from the Simula page (was down on 2026-11-06; retry) and a documented CVC-ClinicDB mirror with checksum
