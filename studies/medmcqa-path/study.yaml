datasets:
- id: medmcqa
  role: benchmark
study_type: LLM benchmarking / robustness evaluation with expert answer-key adjudication (diagnostic accuracy of
  model consensus for key errors)
reporting_guideline: TRIPOD-LLM; MI-CLEAR-LLM items for prompts, decoding and answer parsing; STARD items for the
  key-error detection analysis
novelty_delta: The source tested only MedGemma 4B/27B on pooled MedMCQA with a parser that reads the first A-D character
  in any output, and Medmarks has since shown answer-order sensitivity across 61 models. No MedMCQA answer-key audit
  or validated 'model consensus finds wrong keys' study was found. Adds a pathologist audit (with second rater)
  of all 630 pathology/microbiology/biochemistry validation items, anchored-aware 24-permutation and cloze scoring
  of 11 open 2026 models with a strict parser, tests whether order flips and CoT changes concentrate in flawed items,
  and measures permutation consensus as a key-error detector (AUROC against expert labels) and as an abstention
  signal.
compute:
  tier: runpod
  estimate: About 30-50 GPU-h on RunPod (vLLM, BF16; L40S/A100, 80 GB for 27-31B and gpt-oss) for 11 models x 630
    items x up to 24 orderings (direct and cloze) plus thinking/CoT on 4 cyclic orderings; roughly US$40-90. Optional
    frontier API arm about US$20-40. Expert audit about 20-25 h for Atul plus about 190 items for a second rater
est_weeks: 6
