risks:
- 'Novelty check incomplete: OpenAlex budget exhausted, Semantic Scholar and arXiv API rate-limited on 2026-11-06
  (Crossref, Europe PMC and web search used); rerun arXiv and OpenAlex searches before the protocol'
- Medmarks (arXiv 2605.01417) already reports multi-model answer-order sensitivity on MedMCQA; novelty rests on
  the expert key audit, item-flaw stratification and the consensus-as-detector analysis, not on order sensitivity
  itself
- Source headline numbers may be parser artefacts (first A-D character anywhere in the output; 256-token CoT cap)
  and the paper has internal inconsistencies (distractor-swap drop -8.9 in text vs 0.0 in table; 1,000-item subsets
  for 27B cloze and voting); replicate with both the original and a strict parser
- 'Expert time and single-rater bias: about 25 h of auditing; a second rater on a stratified 30% with Cohen''s kappa
  is needed'
- Model consensus can be confidently wrong where coaching sources share a misconception; use it only to triage items
  for expert review, never to overturn keys
- 'Ceiling effects: newer models may exceed 90% on old items, where position bias is hard to detect; include 4B
  models and report by size'
- 'Licences: MedMCQA HF card says Apache-2.0 in metadata but ''Needs More Information'' in text, GitHub repo is
  MIT; question text comes from exam/coaching material, so release only item ids, audit labels and aggregates; MedGemma
  uses Health AI Developer Foundations terms'
- 'Contamination: MedMCQA is old and public, inflating absolute accuracies; within-item paired comparisons are less
  affected'
- 'Overlap inside this repo: quantised-labmed uses the same 630 items for quantisation and plans a pathology key
  audit (its Gap 5); do the audit once here and share it, and keep the model panel aligned with quantised-labmed
  and mpib-small-llm'
