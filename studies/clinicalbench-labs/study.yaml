risks:
- Partial overlap with Peng et al. (JAMIA 2026, MIMIC-IV first-24 h vitals+labs, LLMs vs XGBoost for mortality/LOS)
  and ClinicRealm (npj Digit Med 2026); frame around leakage and the ClinicalBench cohort and cite both
- 'PhysioNet DUA: MIMIC rows must never reach external LLM APIs (including this Claude session); local open-weight
  models only, aggregates only leave Atul''s machine; confirm a private, wiped RunPod pod is acceptable'
- Split indices are valid only on MIMIC-IV v2.2; lab itemids changed between v2.2 and v3.0, so map mimic-code lab
  concepts against v2.2 d_labitems
- Low mortality prevalence (200/5,768 per test split) gives wide AUROC intervals; pool 5 splits, report AUPRC and
  paired bootstrap
- Legacy answer-token lookup returns <unk> for some SentencePiece tokenisers; use --token_id_mode auto for new models
  and report invalid rates
- Released ClinicalBench result files are patient-level MIMIC-derived outputs; keep them outside the repo
- Llama 3 and Gemma 2 anchors are manually gated with custom licences; MedGemma uses Health AI Developer Foundations
  terms
access_actions:
- PhysioNet credentialing + CITI 'Data or Specimens Only Research' training, then sign the DUA for MIMIC-IV v2.2
  (~1-2 weeks; start early; shared with cirrhosis-sepsis-icu)
- 'Hugging Face: request gated access to meta-llama/Meta-Llama-3-8B-Instruct and google/gemma-2-9b-it (manual),
  accept terms for epfl-llm/meditron-7b and google/medgemma-1.5-4b-it (auto)'
- Accept the auto gate on HF dataset canyuchen/clinicalbench-results to re-score the paper without a GPU
- Private RunPod pod with encrypted volume (or local GPU) for LLM inference; no external LLM APIs
