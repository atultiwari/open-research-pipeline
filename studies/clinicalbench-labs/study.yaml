novelty_delta: ClinicalBench feeds models only whole-stay ICD diagnoses, procedures and drugs, the hindsight inputs
  Ramadan et al. (JAMA Netw Open 2025) showed leak in-hospital mortality; nobody has tested whether its 'ML beats
  LLMs' result survives without them. On the same patients and published v2.2 splits, this compares original, leak-pruned,
  admission-time (routine CBC/chemistry/renal/liver/coagulation labs from -6 h to +24 h) and labs-only inputs, with
  lab-report formatting (raw vs reference range + H/L flag vs flag-only), 2026 local open-weight LLMs, calibration
  and a pathologist error taxonomy. Peng et al. (JAMIA 2026) and ClinicRealm (npj Digit Med 2026) already compare
  LLMs with XGBoost on MIMIC-IV physiology/labs, so novelty rests on the leakage contrast, labs-only and format
  arms, and the ClinicalBench cohort.
