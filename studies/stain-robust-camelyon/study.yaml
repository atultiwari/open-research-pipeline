  feasibility: 3
  novelty: 4
  fit: 4
risks:
- 'Ceiling effect: FM+ABMIL AUC on CAMELYON16 is near saturated, so AUC ranges may be tiny; mitigated by calibration
  metrics and ITC/micro strata'
- 'Data volume: ~2.2 TB of WSIs must be streamed slide by slide; tile cache size unmeasured'
- CAMELYON17 test-set labels are not public; external analysis uses the 500 labelled training WSIs (100 per centre),
  and only CWZ, RST and LabPON are external to CAMELYON16
- Macenko-style unmixing is unreliable on blood, pigment and necrosis (source limitation); lymph nodes need QC
- UNI2-h, Virchow2 and H-optimus-1 are CC-BY-NC-ND (H-optimus-1 manual gating); features cannot be shared
- PathoROB (Nat Commun 2026) already covers centre robustness of FM embeddings on CAMELYON tiles; novelty rests
  on controlled simulation vs real-centre slide-level outcomes; OpenAlex novelty search not yet run
access_actions:
- 'None for data: CAMELYON16/17 on AWS Open Data, CC0, no account (aws s3 --no-sign-request, us-west-2)'
- 'Hugging Face gated access: UNI2-h, Virchow2 (auto); H-optimus-1 (manual, institutional email); H-optimus-0, Hibou-L
  (auto); Midnight not gated'
- Download the CTPLab stain reference library from Hugging Face (Apache-2.0, not gated)
