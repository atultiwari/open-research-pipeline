novelty_delta: The protocol was shown only for colorectal MSI on one external cohort and was never checked against
  real laboratories. Applies it to nodal metastasis and tests whether a model's simulated stain robustness on CAMELYON16
  predicts its real performance and calibration drop at the five CAMELYON17 centres. Adds calibration (the authors'
  stated future work) and an ITC/micro/macro stratification with a pathologist error review.
compute:
  tier: runpod
  estimate: ~40–80 GPU-h feature extraction (5 stain conditions × 3–4 FMs, ~900 WSIs streamed from AWS, ~2.2 TB;
    RunPod ~US$40–120); ABMIL training, calibration and size analyses on one GPU/laptop
est_weeks: 8
