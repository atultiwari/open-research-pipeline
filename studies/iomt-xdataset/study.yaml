study_type: Benchmark / leakage audit + external validation (ML evaluation)
reporting_guideline: 'TRIPOD+AI (adapted: data sources, splits, leakage, validation items); no IDS-specific guideline
  exists'
novelty_delta: Cross-dataset transfer (Jodayree 2026; DEA-IDS 2026), leave-one-attack-out, int8 and SHAP-stability
  work on CICIoMT2024 or its relatives already exist, so the register's bundle is no longer new. This study measures,
  protocol by protocol, how much pooled random splits, oversampling before the split, cross-split duplicates and
  seen-attack-only testing inflate CICIoMT2024 scores, re-scores the source's Tsetlin Machine and standard baselines
  under one clean protocol, and publishes a feature-harmonisation table for honest transfer to CICIoT2023 and WUSTL-EHMS-2020.
