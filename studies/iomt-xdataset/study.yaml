risks:
- 'Crowded field: an unidentified paper reportedly gives a 24.68% near-duplicate rate and 0.16% cross-split duplication
  for CICIoMT2024; if it is a full audit, novelty falls to re-scoring published claims'
- 'Novelty check ran on Crossref, Europe PMC and web search only (OpenAlex budget exhausted, arXiv API 429); rerun
  OpenAlex cites: and arXiv before the protocol'
- WUSTL-EHMS-2020 shares only 5-8 semantically matched features with CICIoMT2024 and has no pcaps; its identifier
  columns (SrcMac, SrcAddr) leak the label and must be dropped
- CICIoMT2024 Wi-Fi/MQTT row counts differ between papers (about 7.0-7.2 M train, 1.6-2.2 M test); record file names,
  checksums and download date
- CIC datasets have no formal licence (FAQ permission only) and WUSTL states none; never redistribute rows
- Source code is GPL-3.0 and covers only the Bluetooth scenario
- 'Low fit for a pathologist: no clinical-judgement component; value is the leakage-audit method shared with HepatoBench'
- 'Defensive scope only: attack names appear only as dataset labels; no traffic generation or evasion work'
access_actions:
- CIC registration form for CICIoMT2024 (free; name, email, organisation, job title, country)
- Same CIC form for CICIoT2023 (free); download a stratified subset of the CSVs only
- 'WUSTL-EHMS-2020: direct CSV download, no registration'
- 'Optional: a Raspberry Pi 4/5 for measured edge latency'
