risks:
- 'Crowded field: NHANES-based CBC models with Kenyan and Indian validation (Pullakhandam 2024; Palika 2026) and
  multi-site deployed models (Chang 2025) exist; novelty rests on the LLM/TabPFN head-to-head, honest rule baselines
  and the label analysis'
- Source data are private and code is not shared; replication is a method replication on a different population
  (NHANES household sample vs outpatients sent for iron studies), so AUCs will differ
- 'Ferritin eligibility differs by NHANES cycle: men and older adults only in 2017–2020; FERTIN_L (2021–23) covers
  females 12–49 and children 1–5 only, and there is no FETIB_L, so TSAT cannot be validated temporally'
- Small Kenyan external set (528 adults; 81 with ferritin < 15, mostly women) gives wide CIs; altitude raises Hb
- Analyser shift (source Sysmex XN; NHANES DxH 800 and Kenya ACT 5 DIFF are Beckman) affects RDW and MCHC
- 'LLM arm: check API terms before sending NHANES/Kenyan rows (no training on inputs); output parsing failures and
  run-to-run instability must be reported; TabPFN weight licence and row limit to verify'
- 'The register''s planned Yemeni external set is excluded: de-identification and data-quality concerns found on
  2026-11-06, pending clarification with the depositors'
- 'Survey weights: WTMECPRP/WTMEC2YR for 2017–2020 labs, WTPH2YR for 2021–23, always with SDMVSTRA/SDMVPSU'
access_actions:
- 'None needed for NHANES: public-use XPT files without an account (NCHS data use agreement: statistical analysis
  only, no re-identification or linkage)'
- 'None needed for the Kenyan set: open Figshare download (CC BY 4.0), doi:10.6084/m9.figshare.21107986'
- API key and budget (~USD 20–60, verify) for one hosted LLM; confirm its terms exclude training on submitted data
