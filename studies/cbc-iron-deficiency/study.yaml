study_type: Diagnostic prediction model development + temporal and external validation; LLM vs tabular foundation
  model vs ML vs haematology rules
reporting_guideline: TRIPOD+AI and TRIPOD-LLM (LLM arms); STARD elements for the ferritin reference-standard analysis
novelty_delta: CBC-based low-ferritin models and NHANES-to-Kenya/India validation of iron-deficiency-anaemia models
  already exist (Pullakhandam 2024; Palika 2026), and their IDA labels leak Hb. This study adds a head-to-head of
  zero/few-shot LLMs and TabPFN against spline logistic regression, XGBoost and pathologist rules (MCH, Mentzer),
  a ferritin-label analysis (sex-specific, 15/30 µg/L, inflammation-aware, physiological, IDA with and without Hb)
  across men, women and older adults, and survey-weighted calibration and test-utilisation decision curves in NHANES
  2021–23 and Kenyan healthy adults.
