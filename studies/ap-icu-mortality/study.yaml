study_type: Prognostic model replication + endpoint-harmonised, bidirectional external validation of published models
  and severity scores, with a leakage-free reimplementation and a case-definition sensitivity analysis
reporting_guideline: TRIPOD+AI; RECORD
novelty_delta: The source trains on 28-day mortality but validates on in-hospital mortality, selects features outside
  cross-validation and re-fits preprocessing on eICU; its own output shows plain logistic regression ahead of XGBoost.
  No published ICU acute-pancreatitis model has been validated independently, on a harmonised endpoint, or in both
  directions (the eICU-derived ABL equation has never been tested in MIMIC-IV). This study does that against BISAP,
  SOFA and APACHE IVa with proper calibration statistics, and checks whether an enzyme-confirmed (revised Atlanta)
  cohort changes the answer.
