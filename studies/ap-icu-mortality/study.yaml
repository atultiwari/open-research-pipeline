risks:
- Crowded field (170+ MIMIC/eICU pancreatitis mortality papers); OpenAlex search was rate-limited on 2026-11-06
  - rerun novelty checks before the protocol
- 'Cohort-extraction SQL is not released; exact replication depends on rebuilding the authors'' cohort from the
  Methods (several steps ambiguous: imaging confirmation, ''missing outcome'' exclusions, eICU AP source)'
- 'Few eICU deaths (35 in the source cohort): wide CIs, hospital-level analysis descriptive only'
- 'BISAP items need proxies: impaired mental status via GCS < 15 (sedation), pleural effusion via ICD codes or local
  regex on MIMIC-IV-Note radiology reports (none in eICU); BISAP is defined at hospital, not ICU, admission'
- 'eICU has no billing diagnoses: Charlson and AP phenotyping depend on ICU-documented diagnoses and pasthistory;
  whether lipase/amylase are charted in eICU lab is unverified'
- Source preprint may change during peer review (journal moved from JMIR to BMC MIDM per Zenodo/Research Square);
  recheck numbers before submission
- 'PhysioNet DUA: no row-level data or notes to Claude or any external LLM API; analysis runs locally with aggregates
  only shared back'
- No open post-ERCP pancreatitis dataset exists; the register's planned ERCP follow-on cannot be done on open data
access_actions:
- PhysioNet credentialing + CITI 'Data or Specimens Only Research' training + sign the Credentialed Health Data
  Use Agreement 1.5.0 on the MIMIC-IV v3.1 and eICU-CRD v2.0 pages (~1–2 weeks; same credential as cirrhosis-sepsis-icu)
- 'Optional: sign the DUA for MIMIC-IV-Note v2.2 (pleural effusion from radiology reports, local text search only)'
- Download the latest Zenodo version of the authors' MIT-licensed script (record 21465873); read Supplementary Table
  S6 (AP-METRIC points) and S7 (missingness) from the Research Square appendix
- Confirm units of the ABL equation (Li 2020, BMJ Open; lactate mmol/L, BUN mg/dL assumed)
