risks:
- Weights not yet released; retraining from the unlicensed repo is allowed for research, but publishable code should
  be a reimplementation
- WSI-Bench has no stated licence; the HF copy is gated with conditions
- CONCH v1.5 and TITAN are CC-BY-NC-ND and gated; research use only
- CPTAC has no free-text reports, so the external arm tests diagnosis and morphology claims, not BLEU
- 'Pathologist review time: ~100 slides × 10–15 min on the GDC slide viewer'
- Knowledge graph was curated from WSI-Bench ground-truth reports; whether test reports were excluded is not stated
  (possible leakage)
