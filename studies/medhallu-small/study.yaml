study_type: LLM evaluation / hallucination-detection benchmark study with expert label audit
reporting_guideline: TRIPOD-LLM + MI-CLEAR-LLM items for model revision, decoding, prompts and retrieval
novelty_delta: MedHallu tested 2024-era open models only with no evidence or with the source abstract (an answer
  key), without artefact controls or human checks of its machine-generated hallucinations. Adds 2026 sub-10B open
  models (Gemma 4, Qwen3.5, Phi-4-mini, MedGemma 1.5) and CPU-feasible verifiers (HHEM, MiniCheck, NLI) under realistic
  PubMed retrieval with the source paper excluded, length-artefact and difficulty-circularity controls, calibration,
  and a pathologist audit of label validity and error types on about 120-150 lab-medicine items.
compute:
  tier: runpod
  estimate: ~15-25 GPU-h on one 24-48 GB GPU (RunPod L4/L40S/A6000) for 8 small LLM judges x 4 evidence conditions
    x 2,000 paired judgements, roughly US$10-30; verifiers, PubMed retrieval (free NCBI E-utilities) and analysis
    on a laptop; no paid API
est_weeks: 6
