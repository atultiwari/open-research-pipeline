risks:
- 'Novelty check incomplete: arXiv and Semantic Scholar were rate-limited on 2026-11-06 and OpenAlex keyword search
  ran out of budget; rerun before the protocol (active area: MedHELM, PARALLAX, jev harness)'
- 'Retrieval leakage: PubMed may return the source paper, duplicates or citing papers that restate its conclusion;
  exclude the source PMID, add a date-restricted condition and log near-duplicates'
- Machine-generated labels and a single expert rater; add a second rater on 30% or an intra-rater washout re-rate,
  and report kappa
- Oracle-abstract setting is near ceiling for strong models, so headline differences may sit in the retrieval and
  no-evidence conditions only
- Released evaluator does not match the paper (unseeded draw, faulty parser, binary script missing), so replicated
  numbers will differ from Table 2
- 'Licences: MedHallu MIT is stated only in card text (pin revision 515060458a); MedGemma uses Health AI Developer
  Foundations terms; Llama 3.2 needs manual HF approval; Bespoke-MiniCheck-7B is CC BY-NC 4.0; Qwen2.5-3B uses the
  Qwen research licence'
- Never commit row-level items, abstracts or model outputs; publish aggregates and the expert taxonomy counts only
access_actions:
- 'None for data: MedHallu and PubMedQA are open and not gated on Hugging Face (pin MedHallu revision 515060458a945c633debc6fd5baac7764416b724)'
- Accept Health AI Developer Foundations terms (auto-gated) for google/medgemma-1.5-4b-it
- 'Optional: Hugging Face manual approval for meta-llama/Llama-3.2-3B-Instruct (Table 2 anchor)'
- Optional free NCBI API key for E-utilities (higher rate limit); send only a tool name, never Atul's email
- RunPod account with a 24-48 GB GPU
- Find a second pathologist or lab-medicine colleague to re-rate about 30% of the audit subset
