  tier: runpod
  estimate: ~15–20 GPU-h of ABMIL training on precomputed features (4 encoders × 30 folds; ~US$15–20 on RunPod)
    plus a ~130–300 GB lung feature download per encoder to a network volume; statistics on a laptop. Optional IDH1
    anchor adds ~15–25 GPU-h
