study_type: Fairness / subgroup analysis + external validation (open surrogate for a private external cohort)
reporting_guideline: TRIPOD+AI (fairness items) / CLAIM 2024
novelty_delta: The source tested breast and lung models only on private MGB data, with older encoders. FAIR-Path
  (2025) and an ICIP 2026 study show foundation-model gaps on TCGA, but none separates site from race or tests externally
  with current encoders. This study does both on fully open TCGA and CPTAC lung data with four precomputed foundation-model
  feature sets, adds an adequately sized external (131 Asian CPTAC patients) white-versus-Asian test as a pre-registered
  equivalence claim, and adds a pathologist error taxonomy by subgroup.
