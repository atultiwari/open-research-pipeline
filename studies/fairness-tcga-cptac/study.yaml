  fit: 4
risks:
- Novelty partly overlaps FAIR-Path (Cell Rep Med 2025) and García-de-la-Puente et al. (ICIP 2026, full text unread);
  the site decomposition and external Asian arm carry the novelty
- 'CPTAC lung has only 6 Black patients: no external white-versus-Black estimate is possible; TCGA lung has only
  17 Asian patients for training'
- CPTAC slide preparation (frozen vs FFPE) is unconfirmed; a preparation shift would confound the external drop
- Third-party precomputed features (card says public, HF reports gated) must be spot-checked against self-extracted
  features
- 'All feature sets except GigaPath and the source code are CC BY-NC-ND: non-commercial use only, no redistribution
  of features or modified code'
- Self-reported race with many 'not reported' values; South Asian patients are absent from both cohorts, so no direct
  India claim
access_actions:
- Hugging Face account; accept the auto-approved gates for sofieneb/uni2h_features, conch_v15_features, virchow2_features
  and gigapath_features
- No login needed for GDC clinical data (TCGA, CPTAC-3) or TCIA CPTAC slides (CC BY 4.0); cite the TCIA collection
  DOIs
- 'Optional IDH1 anchor: EBRAINS account and Digital Brain Tumour Atlas data use agreement (non-commercial)'
