risks:
- 'Class definitions differ: SICAPv2 merges benign into one ''non-cancerous'' class; Arvaniti and PANDA-Radboud
  label benign epithelium separately, and PANDA masks include stroma'
- PANDA-Radboud masks were not drawn by hand gland by gland for every slide; Kaggle warns of false positives and
  negatives, so treat them as a silver standard
- Arvaniti TMAs come from radical prostatectomies at a different magnification; resampling may itself shift embeddings
- Most strong encoders are CC-BY-NC-ND and gated (UNI, UNI2-h, CONCHv1.5, Virchow2); keep to research use
- The source repo pins TensorFlow 2.8 and GPflow 2.1.3; old CUDA builds may not run on new GPUs
access_actions:
- 'Hugging Face gated access (auto-approved): UNI, UNI2-h, CONCHv1.5, Virchow, Virchow2, Prov-GigaPath; Phikon-v2
  is not gated'
- Kaggle account and PANDA competition rules acceptance; download only Radboud slides with label masks
- 'Direct downloads, no account: SICAPv2 (Mendeley Data), CrowdGleason (Zenodo), Arvaniti TMAs (Harvard Dataverse)'
