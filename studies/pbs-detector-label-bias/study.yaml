risks:
- 'Crowded field: many YOLO-on-blood-smear papers; the contribution must be the bias and generalisation evidence,
  not another leaderboard'
- 'Pathologist re-annotation time: 126 test images with ~1,800 boxes (~2–3 days with a pre-label-free tool)'
- TXL-PBC repackages PBC (CC BY 4.0) and Raabin-WBC (no stated licence) under MIT; keep use research-only and cite
  all sources
- BBBC041 is malaria smears (CC BY-NC-SA 3.0) with no platelet class
