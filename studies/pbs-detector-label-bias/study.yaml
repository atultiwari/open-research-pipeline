id: pbs-detector-label-bias
title: Do blood-smear detector rankings reflect the labeller? Pathologist re-annotation and leave-one-source-out
  testing of YOLO and transformer detectors on TXL-PBC, with cell-count agreement
area: computational-pathology
source:
  type: conference
  title: Comparative Evaluation of YOLO Architectures for Automated Peripheral Blood Smear Cell Detection
  authors: Shah A et al.
  venue: 2026 International Conference on Intelligent Computing and Sustainable Innovations in Technology (IC-SIT),
    IEEE; paywalled
  date: '2026-09-08'
  url: https://doi.org/10.1109/IC-SIT69723.2026.11735904
  doi: 10.1109/IC-SIT69723.2026.11735904
  code_note: No code found. Full text is paywalled; only the abstract and IEEE metadata were read.
  code_licence: n/a (no repository)
study_type: Methodological benchmark of object detectors (annotation-source bias, cross-source generalisation, count
  agreement)
reporting_guideline: CLAIM 2024
novelty_delta: The source ranks YOLOv3–v8 on TXL-PBC and finds YOLOv8 best, but TXL-PBC labels were pre-drawn by
  a YOLOv8n model and then reviewed, and its split mixes the four source datasets at random. This study has a pathologist
  re-annotate the test set from scratch, tests whether detector rankings change, tests leave-one-source-out generalisation
  and an external expert-labelled set (BBBC041), and reports per-field cell-count agreement instead of mAP alone.
compute:
  tier: colab
  estimate: '1,260 small images: each detector trains in under 1 GPU-h on a Colab T4 or laptop GPU; ~8 detectors
    × 5 seeds × (random + 4 leave-one-source-out splits) ≈ 20–40 GPU-h on RunPod (~US$10–20)'
est_weeks: 5
