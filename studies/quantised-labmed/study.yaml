  fit: 4
risks:
- Quantisation effects of 1-3 points may sit inside confidence intervals; mitigate with paired greedy runs, all
  1,100 MedCalc items and a mixed-effects model across tasks
- Engine and chat-template confounds (vLLM vs llama.cpp, Gemma 4/Qwen3.5 thinking toggles) can masquerade as quantisation
  loss; run each comparison on one pinned engine build and check parsing before full runs
- Partial overlap with Twagirayezu & Mitra (arXiv 2609.22216) on MedMCQA/Med-HALT INT4 effects; frame those as confirmation
  on 2026 models, with novelty resting on calculations, QAT vs PTQ and laptop deployment
- Med-HALT lab items reuse MedMCQA validation stems (577/577 exact matches), so they are not independent evidence;
  analyse as paired formats
- MedHallu card states no dataset licence (MIT applies to the code repo); MedCalc-Bench is CC-BY-SA-4.0 share-alike;
  MedGemma uses Health AI Developer Foundations terms; report aggregates only
- 'Contamination: MedMCQA and PubMedQA are old and public, inflating absolute scores of newer models (paired differences
  are less affected)'
- 'Overlap risk inside this repo: keep MedMCQA prompt-sensitivity (medmcqa-path) and full-precision MedHallu detection
  (medhallu-small) questions out of scope; align the model panel with mpib-small-llm'
access_actions:
- 'None needed for data: MedCalc-Bench Verified, MedMCQA, Med-HALT, MedHallu and MEDEC are open and not gated on
  Hugging Face/GitHub'
- Accept Health AI Developer Foundations terms (auto-gated) for google/medgemma-1.5-4b-it
- RunPod account with an L40S or A100 (80 GB needed only for the Qwen3-30B-A3B BF16 replication)
- Access to a typical laptop (8-16 GB RAM, CPU-only and/or Apple silicon) for the timing subset
