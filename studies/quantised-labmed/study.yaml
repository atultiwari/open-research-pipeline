  tier: runpod
  estimate: About 30-50 GPU-h on RunPod (llama.cpp and vLLM on an L40S/A100; roughly US$30-70) for 7 models x 4-5
    precisions x ~4,800 items with greedy decoding plus 3-seed sensitivity on a subset; timing runs on a real laptop
    (CPU/Apple silicon); no paid API
