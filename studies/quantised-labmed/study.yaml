study_type: LLM benchmarking / deployment evaluation (paired precision comparison)
reporting_guideline: TRIPOD-LLM; MI-CLEAR-LLM items for model version, quantisation format, engine build and decoding
novelty_delta: Medmarks tested quantisation on one 30B MoE model (Qwen3-30B-A3B, FP8/AWQ) on H100s and could not
  test quantisation-aware training; Twagirayezu & Mitra (2026) covered GPTQ INT4/INT8 on older 7-8B models for MedMCQA
  and Med-HALT. Adds the first test of numerical lab calculations (380 MedCalc-Bench lab items) under quantisation,
  a same-format QAT vs post-training Q4 contrast (Gemma 4 official QAT GGUFs), 2026 small models run as GGUF on
  llama.cpp with laptop speed, RAM and rupee cost, hallucination/abstention and calibration outcomes, and a pathologist
  taxonomy of answers that flip at 4-bit.
