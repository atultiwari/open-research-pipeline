novelty_delta: HepatoBench was released without slide or patient identifiers or split files and contains exact duplicates,
  so its published foundation-model results (UNI, Virchow2, GigaPath; linear probe; no confidence intervals) cannot
  be reproduced with a leakage-free split. This study measures how much random patch splits inflate accuracy, re-benchmarks
  newer and lighter open encoders under duplicate-aware grouped splits with calibration, adds a pathologist error
  taxonomy, and tests transfer to an independent Korean cohort (PAIP 2019).
