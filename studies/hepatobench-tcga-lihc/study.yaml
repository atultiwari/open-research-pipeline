risks:
- 'Licence conflict (card CC BY vs paper CC BY-NC vs article CC BY-NC-ND): use for non-commercial research only
  and never redistribute patches'
- 'Authors state the dataset is not for diagnosis-focused algorithms: frame the work as benchmark quality and quantification,
  not diagnosis'
- Pseudo-groups reconstructed from consecutive indices and embedding clusters are an approximation of slides; report
  sensitivity to the grouping rule
- Several encoders (UNI2-h, Virchow2, H-optimus) are gated with non-commercial licences; access may be refused or
  delayed
- PAIP 2019 post-challenge access and publication terms must be confirmed before the external arm
- Original paper reports results only in a figure; target numbers must be read from Figure 2
access_actions:
- Hugging Face account; request gated access for UNI2-h, Virchow2, H-optimus-0/1 and CONCH v1.5 (institutional email
  may be needed)
- Grand Challenge account and PAIP 2019 data use agreement (external arm)
