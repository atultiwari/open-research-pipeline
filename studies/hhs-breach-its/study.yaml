risks:
- 'Crowded field: Ignatovski 2026, Jackman 2026, Yankson 2025, Sun 2026 and two Xu 2025 IEEE papers (methods unchecked;
  may include changepoints) analyse the same portal'
- The source's October 2024 ransomware labels and web-search descriptions are not shared; the artefact test compares
  published aggregates with a new snapshot
- Portal rows change (cases move to the archive, counts are revised, rows removed); every result depends on the
  export date
- Labelling about 600 breach descriptions needs a second coder and a written codebook
- VCDB healthcare incidents are selected from and coded largely from HHS reports, so VCDB is a label cross-check,
  not independent validation; CC BY-SA 4.0 ShareAlike on any shared adapted data
- LLM labels drift with model version; pin the model and prompt
- Outside a pathologist's core field; the laboratory/diagnostic subgroup may be small (verify)
- 'Defensive scope only: categories, counts and dates; no ransom notes, leak-site content or gang tooling'
access_actions:
- 'None required: HHS OCR portal is open with no registration; export both the Under Investigation and Archive tabs
  as CSV by hand in a browser (JSF post-back) and keep date-stamped copies outside the repo'
- 'Optional: git clone vz-risk/VCDB (CC BY-SA 4.0) and record the commit hash'
- Find a second coder for the ransomware reference sample
