study_type: Retrospective secondary analysis of public breach reports (interrupted time series and changepoint)
  with a nested classifier-validation study
reporting_guideline: RECORD (STROBE extension) for the trend analysis; TRIPOD-LLM items and STARD-style accuracy
  tables for the ransomware classifier
novelty_delta: Business-associate trends (Ignatovski 2026), ARIMA trends (Yankson 2025) and ransomware prediction
  (Sun 2026) are already published, so a plain update is not new. This study validates the source's regex ransomware
  label (and a local LLM) against a double-coded reference sample, tests whether the post-2021 fall in ransomware
  is an artefact of undescribed open cases, adds changepoint/ITS models to 2026 with a laboratory subgroup, and
  maps the findings to DPDP Rules 2025 Rule 7 (in force May 2027).
