risks:
- No Barrett's or dysplasia class in any open cohort, so the clinically important task is lost
- Normal (GTEx, postmortem, PAXgene) vs cancer (TCGA, surgical, FFPE) differs in fixation, autolysis and site, so
  detection is confounded by source
- FM ensembling on TCGA is already published (Luo et al., Cancer Cell 2026)
- Only 65 adenocarcinoma diagnostic slides in TCGA-ESCA
access_actions:
