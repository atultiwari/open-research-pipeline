study_type: Defensive adversarial-robustness benchmark (vulnerability, detection and defence cost)
reporting_guideline: CLAIM 2024, plus a pre-specified threat model and adversarial-evaluation items (budget, attacker
  knowledge, defence-aware evaluation)
novelty_delta: The source attacked slide-level models with frozen aggregators, and UTAP (Light Sci Appl 2026) already
  showed universal patch perturbations transfer between patch encoders with linear probes. Adds the first test of
  sparse, label-free perturbations against task-trained attention-MIL heads on eight current patch encoders, uses
  the MIL attention map and encoder disagreement as cheap detectors with their false-alarm cost, measures the clean
  cost of JPEG and stain-normalisation defences, and adds a pathologist's attention audit and threat-plausibility
  analysis.
