risks:
- 'Dual-use: attack code, settings, perturbed images and perturbations must stay in a private analysis repo and
  never be released; publish aggregate metrics only (CLAUDE.md rule 6)'
- 'Overlap risk: SSRN v2 of the source (full text unread, HTTP 403) or a UTAP follow-up may add task-trained MIL
  heads or cross-model transfer; re-check before the protocol'
- 'Novelty check incomplete: OpenAlex (daily budget used) and Semantic Scholar keyword search (HTTP 429) could not
  be run on 2026-11-06'
- Most encoders are CC-BY-NC-ND and gated (H-optimus-1 manual approval); Phikon-v2 uses an Owkin non-commercial
  licence; CHIEF licence stated as AGPL-3.0 on GitHub but GPLv3 non-commercial in its README
- Results depend on attack settings; defences tested only against naive attackers overstate protection, so pre-register
  settings and report defence-aware results
- 'Pretraining overlap: several encoders (e.g. Phikon-v2, Midnight) saw TCGA; CAMELYON16 is the cleaner test'
- Small encoder count (n = 8) for the size and natural-robustness correlations; treat as descriptive
- 'Source repo has no licence: reimplement, do not copy'
