study_type: Benchmark / red-team evaluation
reporting_guideline: TRIPOD-LLM (adapted) + MI-CLEAR-LLM items for model version, quantisation and decoding
novelty_delta: MPIB tested 13 full-precision models (newest small ones MedGemma-4B, Qwen2.5-7B, Llama-3.1-8B) and
  only LLM-based rewriter/sanitiser defences. Adds the first paired test of whether INT8/INT4 and QAT quantisation
  change clinical-harm rates (CHER) under direct and RAG-mediated injection, on 2026 small on-prem models (Gemma
  4, Qwen3.5, Phi-4-mini, MedGemma 1.5), plus cheap classifier detectors with their false-refusal cost, a re-validated
  open judge with a pathologist audit, and an Indian on-prem deployment framing.
compute:
  tier: runpod
  estimate: ~40–70 GPU-h on RunPod (subject inference on L40S/A100; judging with Qwen2.5-72B-AWQ on A100 80 GB/H100),
    roughly US$60–150; classifier detectors and analysis on a laptop
est_weeks: 7
scores:
  feasibility: 4
  novelty: 4
  fit: 3
risks:
- 'Results are judge-dependent: the original judge pipeline is not released and must be rebuilt (quantised 72B judge
  is a deviation); V2 rankings were unstable across judges in the source paper'
- Small cells (about 64-67 adversarial test items per model x defence) may hide quantisation effects; mitigate with
  all 1,226 V1+V2 items and paired tests
- 'Dual-use material: the V2 payload registry and any response or judge file that echoes it must stay outside the
  repo; publish aggregates only'
- MPIB is CC BY-NC 4.0 (non-commercial); MedGemma uses Health AI Developer Foundations terms; Llama 3.2 and Prompt
  Guard 2 need manual Hugging Face approval
- Current vLLM needed (toolkit pins vllm 0.6.6, which predates Gemma 4 and Qwen3.5); version differences can shift
  outputs
- 'Fit for a pathologist is moderate: mostly LLM-security engineering, with expert value in the judge audit and
  error taxonomy'
access_actions:
- Hugging Face gated access (auto-approval) for MPIB v1.2; keep data/restricted/payload_registry.json outside the
