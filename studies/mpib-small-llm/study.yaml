- 'Hugging Face manual-approval access: meta-llama/Llama-3.2-3B-Instruct, meta-llama/Llama-3.1-8B-Instruct (anchor)
  and meta-llama/Llama-Prompt-Guard-2-86M'
- Accept Health AI Developer Foundations terms (auto-gated) for google/medgemma-1.5-4b-it
- RunPod account with an A100 80 GB or H100 for the 72B judge
