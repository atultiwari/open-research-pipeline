risks:
- plismbench and Lee et al. (bioRxiv 2026) cover scanner embedding stability; novelty depends on the smartphone
  and calibration arms
- Several encoders are CC-BY-NC-ND and gated (H-optimus-1 and H0-mini need manual approval)
- Smartphone images are at 400x through an eyepiece; magnification and field differ from WSI tiles
- Tissue-type probe is a proxy task; clinical endpoints are not available on PLISM
