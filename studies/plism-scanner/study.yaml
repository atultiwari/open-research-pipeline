reporting_guideline: CLAIM 2024 (+ TRIPOD+AI calibration items)
novelty_delta: Source cohort is private, and plismbench and Lee et al. (2026) test only scanner embeddings. Adds
  the first foundation-model test on PLISM's 57,902 registered smartphone images, links embedding drift to calibration
  loss (ECE, Brier, prediction flips) with tissue-type probes, tests cheap mitigations, and adds a pathologist error
  taxonomy relevant to phone-on-microscope practice in India.
