risks:
- The official harness and PhysicianBench-UI are not released; our own harness may differ, and the authors' benchmark
  may overlap our tasks when released
- LLM-judged checkpoints need human validation (Atul double-scores a sample)
- Synthetic charts can look artificial; lab trends must be hand-calibrated
- API cost grows quickly with screenshot-heavy long episodes
- Do not commit derived MIMIC-IV demo charts; keep the public task set fully synthetic
