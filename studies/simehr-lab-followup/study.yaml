study_type: Benchmark development and evaluation of LLM computer-use agents (simulation study on synthetic charts)
reporting_guideline: TRIPOD-LLM
novelty_delta: SimEHR ships one task (travel VTE prophylaxis) and MedAgentBench tests EHR agents only through a
  FHIR API. This study adds 30–40 pathologist-authored results-review tasks (critical values, slow trends, pre-analytical
  artefacts such as EDTA contamination or haemolysis, missed follow-up) on synthetic charts, and runs each task
  both through screenshots and through the same chart as structured JSON, to measure what the GUI costs in missed
  abnormal results.
