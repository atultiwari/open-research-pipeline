study_type: Benchmark + leakage-free external validation + calibration and case-level endpoints
reporting_guideline: CLAIM 2024 (+ TRIPOD+AI calibration items)
novelty_delta: WBCBench reported only in-distribution cell-level macro-F1, and the closest prior work (Sharma &
  Tapadiya, arXiv 2608.25148) tested five mature classes from a source DinoBloom had held out, with first-generation
  pathology encoders. This study trains on WBCBench (unseen by every haematology encoder), tests on PBC, the unused
  19-laboratory CytologIA set and smartphone Raabin-WBC with pathologist-harmonised blast and immature-granulocyte
  classes, adds UNI2-h, Virchow2, H-optimus-0 and H0-mini, and reports calibration and case-level differential error
  and blast flags.
