  fit: 5
risks:
- Sharma & Tapadiya (arXiv 2608.25148, MICCAI 2026 workshop) already benchmark 15 frozen encoders across PBC, Matek,
  MLL23 and Raabin with calibration; novelty rests on the leakage-free WBCBench source, blast and immature-granulocyte
  classes, CytologIA, current histopathology encoders and case-level endpoints
- WBCBench licence is non-commercial with no redistribution; cases (not persons) define the splits, 24 people cross
  splits, and 267 test labels changed after the challenge
- Raabin-WBC has no stated licence (site and paper only say it is freely available); its training set was in DinoBloom
  pretraining
- CytologIA labels carry no centre or patient IDs, some images hold several cells, its stated dataset DOI did not
  resolve, and its 23-class codes need expert mapping
- Label harmonisation across four taxonomies (bands, reactive lymphocytes, blasts subtypes) is subjective; PBC is
  healthy donors only (no blasts)
- UNI2-h, Virchow2 and H0-mini are CC-BY-NC-ND and gated (H0-mini and DINOv3 need manual approval)
- Image size reveals which DI-60 analyser took a WBCBench image; resize before training to avoid a shortcut
access_actions:
- Hugging Face gated access to WBCBench 2026 (form plus data-use agreement, automatic approval)
- 'Hugging Face gated access: UNI2-h, Virchow2, H-optimus-0 (auto); H0-mini and DINOv3 (manual, institutional email)'
- 'Direct downloads, no account: PBC (Mendeley Data), Raabin-WBC double-labelled crops (dl.raabindata.com), CytologIA
