  tier: colab
  estimate: ~8–12 GPU-h for frozen features of ~210k crops with 10–12 encoders (Colab Pro or RunPod A40, ~US$3–6);
    baselines ~1–2 GPU-h each; probes and statistics on a laptop
est_weeks: 6
