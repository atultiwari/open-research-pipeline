id: first-epss
name: FIRST EPSS scores (Exploit Prediction Scoring System)
url: https://www.first.org/epss/
alt_urls:
- https://www.first.org/epss/data
- https://api.first.org/epss/
- https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
- https://github.com/empiricalsec/epss_scores
modality: tabular (daily CVE-level exploitation probability and percentile)
organ_or_domain: software vulnerabilities
size: 400,564 scored CVEs in the 2026-11-05 file (model v2026.06.15); daily archive from 2021-04-14
access: open
licence: No formal licence stated; FIRST says the scores are free to use with no registration, and attribution is
  requested in publications
licence_notes: The FIRST website footer is "All Rights Reserved", and the empiricalsec/epss_scores GitHub repo has no
  licence file. Cite EPSS and FIRST; publish aggregates, not a re-hosted copy of the score files. The API is for
  lookups, not bulk download; use the daily CSV or the GitHub archive for bulk work.
institution_country: International (FIRST EPSS SIG; scores generated by Empirical Security)
notes: Model versions change the score scale on fixed dates (v2 2022-02-04, v3 2023-03-07, v4 2025-03-17, v5
  2026-06-15). Any time series crossing these dates mixes models; analyse within one version or state the version.
last_checked: '2026-11-06'
