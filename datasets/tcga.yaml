id: tcga
name: The Cancer Genome Atlas (TCGA) via GDC
url: https://portal.gdc.cancer.gov/
modality: WSI; genomics; clinical
organ_or_domain: pan-cancer
size: ~11,000 patients; diagnostic and tissue slides
access: open
licence: 'No Creative Commons licence stated; GDC open-access tier (no login or authorisation needed, per the GDC
  data access page, 2026-11-06). Follow the NIH GDC data use and TCGA citation policies.'
institution_country: USA (NCI)
notes: 'Projects used here: BRCA, LUAD/LUSC, GBM/LGG, RCC, LIHC. TCGA-LIHC: 379 open diagnostic slides (SVS) from 365 cases,
  503.5 GB (GDC API, 2026-11-06). Use the TCGA Pan-Cancer Clinical Data Resource (TCGA-CDR) for survival endpoints. Demographics (GDC API, 2026-11-06):
  TCGA-LUAD+LUSC 1,089 cases, 744 white, 84 Black, 17 Asian, rest not reported; the 84 Black patients come from 20
  of 43 tissue source sites, and three sites hold 46% of them (race is confounded with site). TCGA-BRCA 1,098 cases,
  757 white, 183 Black, 61 Asian. TCGA-LGG 516 and TCGA-GBM 617 cases, 72 Black and 21 Asian in total.'
last_checked: '2026-11-06'
