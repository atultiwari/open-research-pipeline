labels: 'ISUP grade / Gleason score per slide. Some training slides have label masks: Radboud masks label glands as 0 background, 1 stroma, 2 benign epithelium, 3/4/5 Gleason 3/4/5; Karolinska masks are benign vs cancer only. Kaggle warns masks may contain false positives and negatives.'
notes: PANDA-PLUS (Hopson et al., J Pathol Inform 2026, doi:10.1016/j.jpi.2025.100540) adds pixel-level expert masks for 546 PANDA slides, but those masks are available only on qualified request, so they are not open.
