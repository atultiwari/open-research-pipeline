access: open
licence: Apache-2.0
licence_notes: 'Apache-2.0 on openlifescienceai/medmcqa (HF card, 2026-11-06, not gated). The lighteval/med_mcqa
  mirror that the Medmarks harness loads states no licence on its card; cite and license from the original. The
  same HF card''s "Licensing Information" section reads "Needs More Information", and the original GitHub repo (medmcqa/medmcqa,
  which also hosts a Google Drive download) is MIT: a card/repo mismatch, so cite both and record the HF revision
  (91c6572c454088bf71b679ad90aa8dffcd0d5868, checked 2026-11-06). Questions come from AIIMS/NEET-PG exam and coaching
  material whose own copyright is not addressed; never republish item text, only ids and aggregate results.'
institution_country: India
labels: Answer key, subject field (Pathology, Microbiology, Biochemistry, …), single/multi choice type, explanation
citation: 'Pal A, Umapathi LK, Sankarasubbu M. MedMCQA: A Large-scale Multi-Subject Multi-Choice Dataset for Medical
  domain Question Answering. Proceedings of CHIL 2022, PMLR 174:248-260'
notes: 'Answer keys are noisy (Medmarks Appendix P found unclear or wrong items). Validation subject counts (HF
  dataset viewer statistics, 2026-11-06): Pathology 337, Biochemistry 171, Microbiology 122, Dental 1,318. Med-HALT
  reasoning FCT/NOTA validation items reuse MedMCQA validation stems: all 577 Pathology/Biochemistry/Microbiology
  Med-HALT validation questions match MedMCQA validation text exactly (3,810 of 5,154 overall), so the two are not
  independent. Aggregate checks by medmcqa-path on the validation parquet (HF revision 91c6572c, 2026-11-06; nothing
  committed but counts): Pathology + Microbiology + Biochemistry = 630 rows with 630 unique ids and no duplicate
  stems (quantised-labmed''s "629 unique" is probably an off-by-one, verify); 175 of the 630 are choice_type "multi";
  338 have an explanation; 102 carry an AIIMS 2017-2020 tag. Key positions in the slice: A 29.4%, B 27.6%, C 21.0%,
  D 22.1% (whole validation split: A 32.2%, B 25.9%, C 22.1%, D 19.7%). 43 slice items (335 in the full split) have
  a position-anchored option such as "all of the above", "none of the above" or "both"; in 11 slice items that option
  is the key, so naive option shuffling changes the meaning of these items. Train split holds 14,884 Pathology,
  11,314 Microbiology and 8,282 Biochemistry items (usable for few-shot pools); the test split has no public answers.'
last_checked: '2026-11-06'
