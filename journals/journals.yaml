# Zero-APC journal shortlist. Converted from _seed/journals.md (researched 2026-11-04).
# "verify" = the publisher page did not load during research, or the value was not shown.
researched: "2026-11-04"
notes:
  - Publish free by choosing the subscription (non-open-access) route at acceptance in a hybrid journal.
  - India gets no automatic APC waiver from Research4Life, Springer Nature, Wiley, Taylor & Francis or Wolters Kluwer, so fully open-access journals are excluded.
