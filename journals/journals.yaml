excluded:
  - name: Journal of Pathology Informatics
    reason: APC US$1,670 since October 2024
    source: https://www.pathologyinformatics.org/updates-on-new-jpi-publisher-and-jpi-publication-fees
  - name: Scientific Reports; IEEE Access
    reason: Fully open access with APC
  - name: International Journal of Information Security
    reason: Now fully open access, APC US$3,690
  - name: PLOS Digital Health
    reason: APC US$3,165 unless Fee Assistance is granted
  - name: Intelligence-Based Medicine; Informatics in Medicine Unlocked
    reason: APC US$2,500 and US$2,710
  - name: Gastro Hep Advances; JGH Open; Hepatology Communications
    reason: Fully open access with APC
  - name: BMC titles (BMC Medical Informatics and Decision Making, BMC Gastroenterology, BMC Medical Imaging, Diagnostic Pathology)
    reason: APC; India pays 25% under BMC's pilot, still not zero
  - name: JMIR family
    reason: Waivers only in exceptional cases
  - name: Indian Journal of Medical Research (ICMR)
    reason: No fee, but rejects work already posted as a preprint (conflicts with preprint-first)
